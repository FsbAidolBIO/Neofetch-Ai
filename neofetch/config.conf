# ─────────────────────────────────────────────────────────────────────────────
#  neofetch config — Neofetch-Ai
#
#  Установка:
#      mkdir -p ~/.config/neofetch
#      cp neofetch/config.conf ~/.config/neofetch/config.conf
#
#  Проверить без установки:
#      neofetch --config neofetch/config.conf
#
#  Свою копию всех настроек по умолчанию даёт:  neofetch --gen-config
#  Описание опций: https://github.com/dylanaraps/neofetch/wiki/Customizing-Info
# ─────────────────────────────────────────────────────────────────────────────


# ── Какие поля показывать и в каком порядке ──────────────────────────────────
print_info() {
    info title
    info underline

    info "OS" distro
    info "Host" model
    info "Kernel" kernel
    info "Uptime" uptime
    info "Packages" packages
    info "Shell" shell
    info "Resolution" resolution
    info "DE" de
    info "WM" wm
    info "WM Theme" wm_theme
    info "Theme" theme
    info "Icons" icons
    info "Terminal" term
    info "Terminal Font" term_font
    info "Font" font
    info "CPU" cpu
    info "GPU" gpu
    info "Memory" memory
    info "Swap" swap
    info "Disk" disk
    info "Battery" battery
    info "Locale" locale

    # Опционально — раскомментируйте, что нужно:
    # info "Song" song
    # info "CPU Usage" cpu_usage
    # info "GPU Driver" gpu_driver
    # info "Local IP" local_ip
    # info "Public IP" public_ip
    # info "Users" users
    # info "Weather" weather
}


# ── Заголовок: пользователь@хост и подчёркивание ─────────────────────────────
title_fqdn="off"      # off: только имя хоста, on: полное доменное имя
underline_enabled="on"
underline_char="-"


# ── Логотип ──────────────────────────────────────────────────────────────────
# "auto" — угадать по дистрибутиву, имя из `neofetch --ascii distro list` —
# принудительно (arch, Debian, Ubuntu, ...), "off" — без логотипа.
ascii_distro="arch"
ascii_bold="on"
# Цвета art'а по порядку (0-15; 6 = cyan, 4 = blue). Arch рисуется одним цветом.
ascii_colors=(6 6 6 6 6 6)


# ── Цвета текста: заголовок, @, подчёркивание, подпись, двоеточие, значение ──
colors=(6 6 8 6 8 7)
bold="on"
separator=":"


# ── Ядро и дистрибутив ───────────────────────────────────────────────────────
kernel_shorthand="on"   # on: 6.9.3-arch1-1   off: Linux 6.9.3-arch1-1
distro_shorthand="off"  # off: "Arch Linux"   on: "Arch"   tiny: самая короткая форма
os_arch="on"            # показывать архитектуру в строке OS


# ── Аптайм, пакеты, оболочка ─────────────────────────────────────────────────
uptime_shorthand="on"   # on: "2 hours, 14 mins"   tiny: "2h 14m"
package_managers="on"   # on: "1421 (pacman)"
shell_path="off"        # off: "bash"   on: "/usr/bin/bash"
shell_version="on"


# ── Процессор, видео, экран ──────────────────────────────────────────────────
cpu_brand="on"
cpu_speed="on"
cpu_cores="logical"     # logical (с Hyper-Threading) / physical / off
cpu_temp="off"          # C, F или off — температура CPU в строке CPU
gpu_brand="on"          # on: "NVIDIA GeForce RTX 3070"
gpu_type="all"          # all / dedicated / integrated
refresh_rate="off"      # on: "2560x1440 @ 144Hz"


# ── Тема GTK/Qt ──────────────────────────────────────────────────────────────
gtk_shorthand="off"     # off: две строки (GTK2 и GTK3), on: одна
gtk2="on"
gtk3="on"


# ── Память и диски ───────────────────────────────────────────────────────────
memory_percent="on"
memory_unit="mib"       # kib / mib / gib
disk_show=('/')         # раскомментируйте для отдельного /home: ('/' '/home')
disk_subtitle="mount"   # mount (точка монтирования) / name / dir
disk_percent="on"


# ── Разное ───────────────────────────────────────────────────────────────────
color_blocks="on"       # цветные блоки внизу
block_range=(0 7)       # какие цвета показывать
block_width=3
block_height=1

gap=3                   # отступ между логотипом и текстом
yoffset=0               # сдвиг по вертикали
xoffset=0               # сдвиг по горизонтали

stdout="off"            # on — печатать вывод без цветовых кодов
