[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "neofetch-ai"
version = "1.0.0"
description = "neofetch и fastfetch на чистом Python без внешних зависимостей"
readme = "README.md"
requires-python = ">=3.9"
keywords = ["neofetch", "fastfetch", "fetch", "system-info", "cli"]
classifiers = [
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: System :: Systems Administration",
]

[project.optional-dependencies]
test = ["pytest>=7"]

[project.scripts]
neofetch-ai = "neofetch_ai.cli:neofetch_main"
fastfetch-ai = "neofetch_ai.cli:fastfetch_main"

[tool.setuptools]
packages = ["neofetch_ai"]

[tool.pytest.ini_options]
testpaths = ["tests"]
