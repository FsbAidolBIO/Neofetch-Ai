name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Python ${{ matrix.python-version }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.9", "3.11", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Установить пакет и pytest
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test]"

      - name: Тесты
        run: python -m pytest -q

      - name: Смоук-прогон neofetch
        run: python -m neofetch_ai --no-color --stat

      - name: Смоук-прогон fastfetch
        run: fastfetch-ai --no-color --stat

      - name: Прогон скриптов из корня репозитория
        run: |
          python neofetch.py --no-logo --no-color
          python fastfetch.py --json
